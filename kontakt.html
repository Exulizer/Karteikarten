<body>
<div class="sheet">
<header><a class="brand" href="./"><img src="logo.svg" width="40" height="40" alt=""><b>KarteiDeck</b></a><span class="hr"><a class="btn" href="en/contact.html" hreflang="en" lang="en">English</a><a class="btn" href="./">Zur App</a></span></header>
<main>
<h1>Kontakt</h1>
<p>Frage, Fehler oder Idee? Schreib uns. Die Angaben gehen nur an uns und dienen der Antwort.</p>
<form id="kf" data-api="api/index.php" novalidate>
<label for="kname">Name</label><input type="text" id="kname" autocomplete="name" placeholder="Dein Name" maxlength="80" required>
<label for="kmail">E-Mail</label><input type="email" id="kmail" autocomplete="email" placeholder="Für die Antwort" maxlength="190" required>
<label for="kmsg">Nachricht</label><textarea id="kmsg" placeholder="Was möchtest du uns sagen?" maxlength="2000" rows="7" required></textarea>
<input type="text" id="khp" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true" placeholder="Nicht ausfüllen">
<p class="err" id="kerr" role="alert"></p>
<p class="hint">Mehr dazu in der <a href="datenschutz.html">Datenschutzerklärung</a>.</p>
<button class="btn primary" type="submit" id="ksend">Senden</button>
</form>
<p id="kdone" role="status" hidden></p>
<noscript><p>Für das Formular wird JavaScript gebraucht. Du erreichst uns auch per E-Mail: info@karteideck.de</p></noscript>

</main>

<footer><a href="./">Startseite</a><a href="impressum.html">Impressum</a><a href="kontakt.html">Kontakt</a><a href="datenschutz.html">Datenschutz</a><a href="neu.html">Was ist neu</a></footer>
